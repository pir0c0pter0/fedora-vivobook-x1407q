set default=0
set timeout=1
insmod all_video
insmod gzio
set gfxpayload=keep
terminal_output console
terminal_input console

function yoga_live {
    search --file --set=root /boot/yoga-14q8y11.dtb
    set common="root=live:/yoga-live.img rd.live.image rd.overlay=1 console=tty0 console=ttyAMA0,115200n8 efi=noruntime systemd.tpm2_wait=0 systemd.zram=0 rd.plymouth=0 plymouth.enable=0 enforcing=0"
    if [ "$1" = "yoga" ]; then
        set board="acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused pcie_aspm=off nvme_core.default_ps_max_latency_us=0 deferred_probe_timeout=1 rd.driver.pre=simpledrm"
        set guards="modprobe.blacklist=qcom_q6v5_pas,msm,dispcc_glymur,gpucc_glymur,camcc_glymur,videocc_glymur,evacc_glymur,av1ecc_glymur,qcom_pm8008,qcom_pm8008_regulator,i2c_qcom_cci,phy_qcom_mipi_csi2,qcom_camss,ov08x40,vd55g0,leds_qcom_flash,ucsi_glink,pmic_glink_altmode,qcom_pd_mapper,apr,fastrpc,snd_q6apm,q6prm,q6prm_clocks,q6apm_dai,q6apm_lpass_dais,snd_soc_lpass_wsa_macro,snd_soc_lpass_va_macro,soundwire_qcom,snd_soc_wsa884x,snd_soc_x1e80100,rtc_pm8xxx,phy_qcom_edp,phy_qcom_m31_eusb2,phy_qcom_eusb2_repeater,phy_qcom_qmp_combo"
        linux /boot/aarch64/loader/linux $common $board $guards $2
        devicetree /boot/yoga-14q8y11.dtb
    else
        linux /boot/aarch64/loader/linux $common acpi=force initcall_blacklist=arm_smmu_init systemd.unit=multi-user.target
    fi
    initrd /boot/aarch64/loader/initrd /boot/aarch64/loader/yoga-live.cpio
}

menuentry 'Yoga 14Q8Y11 Live (GNOME)' {
    yoga_live yoga "yoga.video=1 yoga.video.fast=1 yoga.video.nocycle=1 yoga.usb=1 yoga.usb3=1 yoga.camera=1 yoga.gpu=1 systemd.wants=yoga-gpu.service"
}

menuentry 'Yoga 14Q8Y11 Live (video de compatibilidade)' {
    yoga_live yoga
}

menuentry 'UEFI AArch64 Live (console)' {
    yoga_live uefi
}
