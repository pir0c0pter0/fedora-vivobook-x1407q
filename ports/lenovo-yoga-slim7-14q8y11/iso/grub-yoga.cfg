    set yoga_trace=
    set yoga_extra="modprobe.blacklist=qcom_q6v5_pas,msm,dispcc_glymur,gpucc_glymur,camcc_glymur,videocc_glymur,evacc_glymur,av1ecc_glymur rd.driver.pre=simpledrm rd.driver.blacklist=phy_qcom_qmp_pcie systemd.unit=graphical.target"
