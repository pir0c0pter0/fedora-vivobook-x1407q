# Menu R8 (2026-11-16). Entradas de diagnostico antigas (A, B, C, D, E, K, L2, L3, W1-W4,
# pausas R2/R3) foram retiradas; estao em local/physical-diag-r2/grub-yoga-r7-antes-da-limpeza.cfg.
# shortcut: diagnostic kernel has no ZRAM; enable it with the final board kernel.
set default=0
set timeout=-1
insmod all_video
insmod gzio
set gfxpayload=keep
terminal_output console
terminal_input console

# yoga_quick <force|off> <small|live> [dtb na ESP] [clean] [upd|wx]
#   force = ACPI, off = Device Tree; small = so initrd (shell), live = sistema completo em RAM;
#   clean = sem earlycon/keep_bootcon; upd = aplica yoga-updates.cpio; wx = modulo pwrctrl no initrd.
# Usa $yoga_trace e $yoga_extra definidos pela entrada.
function yoga_gate {
    echo "YOGA: $2 retorno=$1"
    if [ "$1" != "0" ]; then
        echo 'FALHA: fotografe esta tela e reinicie o notebook.'
        while true; do
            sleep 60
        done
    fi
}

function yoga_quick {
    # $4 = clean: sem earlycon/keep_bootcon, para o terminal (fbcon) ficar dono da tela.
    set yoga_con="earlycon=efifb,ram keep_bootcon"
    if [ "$4" = "clean" ]; then
        set yoga_con=
    fi
    echo "YOGA-R4: acpi=$1 extra=[$yoga_extra] trace=[$yoga_trace]"
    search --file --set=root /boot/0xcdf4802f
    yoga_gate $? SEARCH
    linux ($root)/boot/aarch64/loader/linux-yoga root=live:/yoga-live.img rd.live.image rd.overlay=1 systemd.zram=0 acpi=$1 systemd.unit=multi-user.target console=tty0 console=ttyAMA0,115200n8 loglevel=7 $yoga_con $yoga_trace panic=0 oops=panic efi=noruntime systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas plymouth.enable=0 rd.plymouth=0 enforcing=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused $yoga_extra
    yoga_gate $? LINUX
    if [ "$1" = "off" ]; then
        if [ "$3" != "" ]; then
            # R5: variantes de bisseccao ficam na ESP (a ISO e somente leitura).
            search --file --set=yoga_esp /EFI/BOOT/$3
            yoga_gate $? SEARCH-ESP
            devicetree ($yoga_esp)/EFI/BOOT/$3
        else
            devicetree ($root)/boot/kalambo-lenovo-yoga-slim7x-diag.dtb
        fi
        yoga_gate $? DEVICETREE
    fi
    if [ "$2" = "live" ]; then
        echo 'YOGA: carregando live completo; pode demorar ~5 min'
        if [ "$5" = "upd" ]; then
            # R6: /updates no initramfs e copiado sobre a raiz do live pelo dracut
            # (20-apply-live-updates.sh): sessao GNOME, sshd ligado, chave SSH do root, firmware ath12k sem .xz.
            initrd ($root)/boot/aarch64/loader/initrd-yoga ($root)/boot/aarch64/loader/live-root.cpio ($yoga_esp)/EFI/BOOT/yoga-updates.cpio
        else
            initrd ($root)/boot/aarch64/loader/initrd-yoga ($root)/boot/aarch64/loader/live-root.cpio
        fi
    elif [ "$5" = "wx" ]; then
        # R7: acrescenta /yoga/pci-pwrctrl-pwrseq.ko ao initramfs (so existe no rootfs do live).
        initrd ($root)/boot/aarch64/loader/initrd-yoga ($yoga_esp)/EFI/BOOT/yoga-wifi-extra.cpio
    else
        initrd ($root)/boot/aarch64/loader/initrd-yoga
    fi
    yoga_gate $? INITRD
    echo 'YOGA: BOOT - entregando controle ao kernel agora'
    boot
    yoga_gate 1 BOOT-RETORNOU
}

menuentry 'G3. GNOME + SSH (sem rede) - caminho que funciona' {
    set yoga_trace=
    set yoga_extra="modprobe.blacklist=qcom_q6v5_pas,msm,dispcc_glymur,gpucc_glymur,camcc_glymur,videocc_glymur,evacc_glymur,av1ecc_glymur rd.driver.pre=simpledrm systemd.unit=graphical.target"
    yoga_quick off live kalambo-g1.dtb clean upd
}
