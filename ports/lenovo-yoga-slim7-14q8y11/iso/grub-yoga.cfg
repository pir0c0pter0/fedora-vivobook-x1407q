menuentry 'L1. ACPI: live em texto sem SMMUv2 (referencia, sem teclado)' {
    set yoga_trace=
    set yoga_extra="initcall_blacklist=arm_smmu_init"
    yoga_quick force live
}
menuentry 'Fedora 45: kernel original, raiz por USB (recuperacao)' {
    search --file --set=root /boot/0xcdf4802f
    linux ($root)/boot/aarch64/loader/linux root=live:CDLABEL=YOGA45-EXPERIMENTAL rd.live.image console=tty0 console=ttyAMA0,115200n8
    initrd ($root)/boot/aarch64/loader/initrd
}
