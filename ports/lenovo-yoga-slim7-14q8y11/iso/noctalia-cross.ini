[binaries]
c = ['clang', '--target=aarch64-redhat-linux-gnu', '--sysroot=/work/noctalia-sysroot', '--gcc-install-dir=/work/noctalia-sysroot/usr/lib/gcc/aarch64-redhat-linux/16', '-fuse-ld=lld']
cpp = ['clang++', '--target=aarch64-redhat-linux-gnu', '--sysroot=/work/noctalia-sysroot', '--gcc-install-dir=/work/noctalia-sysroot/usr/lib/gcc/aarch64-redhat-linux/16', '-fuse-ld=lld']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[properties]
sys_root = '/work/noctalia-sysroot'
pkg_config_libdir = ['/work/noctalia-sysroot/usr/lib64/pkgconfig', '/work/noctalia-sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
