SectionVerb {
    Value { TQ "HiFi" }
}

SectionDevice."Mic" {
    Comment "Yoga internal microphones"
    EnableSequence [
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
        cset "name='VA DEC0 MUX' VA_DMIC"
        cset "name='VA DEC1 MUX' VA_DMIC"
        cset "name='VA DMIC MUX0' DMIC0"
        cset "name='VA DMIC MUX1' DMIC1"
        cset "name='VA_DEC0 Volume' 84"
        cset "name='VA_DEC1 Volume' 84"
        cset "name='VA_AIF1_CAP Mixer DEC0' 1"
        cset "name='VA_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='VA_AIF1_CAP Mixer DEC0' 0"
        cset "name='VA_AIF1_CAP Mixer DEC1' 0"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
    ]
    Value {
        CaptureChannels 2
        CapturePriority 100
        CapturePCM "hw:${CardId},1"
    }
}

SectionDevice."Speaker" {
    Comment "Yoga speakers"
    EnableSequence [
        cset "name='WooferLeft DAC Switch' 1"
        cset "name='TweeterLeft DAC Switch' 1"
        cset "name='WooferRight DAC Switch' 1"
        cset "name='TweeterRight DAC Switch' 1"
    ]
    DisableSequence [
        cset "name='WooferLeft DAC Switch' 0"
        cset "name='TweeterLeft DAC Switch' 0"
        cset "name='WooferRight DAC Switch' 0"
        cset "name='TweeterRight DAC Switch' 0"
    ]
    Value {
        PlaybackChannels 2
        PlaybackPriority 100
        PlaybackPCM "yoga_speakers"
    }
}
