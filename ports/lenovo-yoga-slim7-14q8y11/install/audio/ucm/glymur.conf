Syntax 4

LibraryConfig.yoga.SubstiConfig.pcm.yoga_speakers {
    type route
    slave {
        pcm "hw:${CardId},0"
        channels 4
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

SectionUseCase."HiFi" {
    File "HiFi.conf"
    Comment "Yoga 14Q8Y11 speakers"
}

# shortcut: ganho fixo validado no Yoga, revisar com calibracao dos alto-falantes.
FixedBootSequence [
    cset "name='WooferLeft PA Volume' 6"
    cset "name='TweeterLeft PA Volume' 6"
    cset "name='WooferRight PA Volume' 6"
    cset "name='TweeterRight PA Volume' 6"
    cset "name='WSA WSA_RX0 Digital Volume' 66"
    cset "name='WSA WSA_RX1 Digital Volume' 66"
    cset "name='WSA2 WSA_RX0 Digital Volume' 66"
    cset "name='WSA2 WSA_RX1 Digital Volume' 66"
]
